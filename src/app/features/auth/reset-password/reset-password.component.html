<!-- Atmospheric Background Elements -->
<div class="fixed inset-0 z-0 bg-radial-gradient"></div>
<div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container/10 rounded-full blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary-container/10 rounded-full blur-[120px] pointer-events-none"></div>


<!-- Main Content: Forgot Password Card -->
<div class="relative z-10 w-full max-w-md px-6 mx-auto min-h-screen flex flex-col justify-center font-body text-on-surface">
  <div class="bg-surface/60 backdrop-blur-xl border border-white/10 rounded-xl p-10 flex flex-col shadow-[0_32px_64px_rgba(0,0,0,0.4)]">
    <!-- Icon / Brand Mark -->
    <div class="mb-8 flex justify-center">
      <div class="w-16 h-16 rounded-full bg-surface-container-highest flex items-center justify-center border border-white/5">
        <span class="material-symbols-outlined text-primary text-3xl" data-icon="lock_reset">lock_reset</span>
      </div>
    </div>
    
    <!-- Typography Header -->
    <div class="text-center mb-8">
      <h1 class="font-headline text-3xl font-extrabold tracking-tight text-white mb-3">Reset Password</h1>
      <p class="text-on-surface-variant text-sm leading-relaxed max-w-[280px] mx-auto">
          Enter your email address and we'll send you a link to get back into your account.
      </p>
    </div>
    
    <!-- Form -->
    <form class="space-y-6">
      <div>
        <label class="font-label text-[10px] uppercase tracking-widest font-extrabold text-indigo-300 block mb-2 px-1" for="email">Email Address</label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-primary transition-colors">
            <span class="material-symbols-outlined text-xl" data-icon="mail">mail</span>
          </div>
          <input class="w-full !bg-surface-container-low border-0 rounded-xl py-4 pl-12 pr-4 text-white placeholder:text-slate-600 focus:ring-1 focus:ring-primary focus:!bg-surface-container transition-all duration-300" id="email" placeholder="curator@ratemymusic.com" type="email"/>
        </div>
      </div>
      
      <button class="w-full bg-gradient-to-br from-[#6366f1] to-[#a855f7] hover:shadow-[0_0_24px_rgba(99,102,241,0.4)] text-white font-bold py-4 rounded-xl transition-all duration-300 flex items-center justify-center gap-2 group active:scale-95" type="submit">
        <span class="font-label uppercase tracking-widest text-xs">Send Reset Link</span>
        <span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
      </button>
    </form>
    
    <!-- Footer Action -->
    <div class="mt-10 pt-8 border-t border-white/5 text-center">
      <a class="inline-flex items-center gap-2 text-slate-400 hover:text-indigo-200 transition-all text-sm font-medium" routerLink="/auth">
        <span class="material-symbols-outlined text-lg" data-icon="keyboard_backspace">keyboard_backspace</span>
        <span>Back to Sign In</span>
      </a>
    </div>
  </div>
</div>
