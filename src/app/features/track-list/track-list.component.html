<h1 class="page-title">Top Rated Tracks</h1>

<!-- Actions bar could go here -->
<div class="upload-btn-container">
    <a routerLink="/upload" class="btn btn-primary">Upload a New Track</a>
</div>
<!-- Reactive display using the tracks() signal from the service -->
<div class="track-grid" *ngIf="!trackService.isLoading()">
    <div *ngFor="let track of trackService.tracks()">
        <app-track-item [track]="track" (onVote)="handleVote($event)"></app-track-item>
    </div>
</div>

<div *ngIf="trackService.isLoading()" class="loading-container">
    <div class="spinner spinner-anim"></div>
    <p class="loading-text">Loading tracks...</p>
</div>

<div *ngIf="!trackService.isLoading() && !trackService.tracks().length" class="empty-container">
    <p>No tracks found. Add one above to get started!</p>
</div>
