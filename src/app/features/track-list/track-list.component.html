<div class="min-h-screen font-sans flex overflow-hidden fixed inset-0 bg-slate-950 text-slate-100">
  <!-- Main Feed Area -->
  <div class="relative flex-1 flex flex-col h-screen overflow-hidden">
    <!-- MinimalHeader -->
    <header class="fixed top-0 inset-x-0 z-50 px-6 h-16 flex items-center justify-between pointer-events-none" [style.width]="showComments() ? 'calc(100% - 380px)' : '100%'">
      <div class="flex items-center gap-2 pointer-events-auto">
        <div class="w-9 h-9 bg-primary rounded-custom flex items-center justify-center shadow-lg shadow-primary/20">
          <svg class="w-5 h-5 text-surface" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
        </div>
        <span class="text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-primary">RateMyMusic</span>
      </div>
      <div class="flex items-center gap-3 pointer-events-auto">
        <button routerLink="/upload" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface/60 backdrop-blur-xl border border-white/10 hover:bg-white/10 transition-colors" title="Upload">
          <span class="material-symbols-outlined text-white">add_circle</span>
        </button>
        <button routerLink="/profile" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface/60 backdrop-blur-xl border border-white/10 hover:bg-white/10 transition-colors overflow-hidden" title="Profile">
          <span class="material-symbols-outlined text-slate-300">person</span>
        </button>
      </div>
    </header>

    <!-- FeedContent -->
    <main class="h-screen flex-1 no-scrollbar"
          [ngClass]="tracks().length > 1 ? 'overflow-y-scroll snap-y snap-mandatory overscroll-contain' : 'overflow-hidden'"
          data-purpose="track-grid" style="scrollbar-width: none;">
      <ng-container *ngIf="!trackService.isLoading()">
        <app-track-item *ngFor="let track of tracks()" [track]="track" (onVote)="handleVote($event)" (onToggleComments)="toggleComments()"></app-track-item>
        <div *ngIf="!tracks().length" class="h-screen w-full snap-start relative overflow-hidden flex items-center justify-center flex-col gap-4 text-slate-400">
          <span class="material-symbols-outlined text-6xl opacity-50">music_off</span>
          <p class="text-lg">No tracks found. Add one to get started!</p>
        </div>
      </ng-container>

      <div *ngIf="trackService.isLoading()" class="h-screen w-full snap-start relative overflow-hidden flex items-center justify-center flex-col text-slate-400 gap-4">
        <div class="w-10 h-10 border-4 border-white/10 border-t-primary rounded-full animate-spin"></div>
        <p>Loading tracks...</p>
      </div>
    </main>

    <!-- Mobile NavigationTabs -->
    <nav class="fixed bottom-0 inset-x-0 h-16 bg-surface/60 backdrop-blur-xl border-t border-white/10 flex items-center justify-around z-50" [style.width]="showComments() ? 'calc(100% - 380px)' : '100%'">
      <button class="flex flex-col items-center gap-1 text-primary">
        <span class="material-symbols-outlined text-2xl">home</span>
        <span class="text-[9px] font-bold uppercase tracking-widest">Home</span>
      </button>
      <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition-colors">
        <span class="material-symbols-outlined text-2xl">search</span>
        <span class="text-[9px] font-bold uppercase tracking-widest">Discover</span>
      </button>
      <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition-colors">
        <span class="material-symbols-outlined text-2xl">bar_chart</span>
        <span class="text-[9px] font-bold uppercase tracking-widest">Charts</span>
      </button>
      <button routerLink="/profile" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition-colors">
        <span class="material-symbols-outlined text-2xl">person</span>
        <span class="text-[9px] font-bold uppercase tracking-widest">Profile</span>
      </button>
    </nav>
  </div>

  <!-- Comments Panel (toggleable) -->
  <aside *ngIf="showComments()" class="w-[380px] h-screen bg-surface/60 backdrop-blur-xl border-l border-white/10 z-[60] relative flex flex-col">
    <div class="p-6 border-b border-white/10 flex items-center justify-between">
      <h3 class="text-lg font-bold flex items-center gap-2">
        Comments <span class="text-slate-500 text-sm font-medium">(0)</span>
      </h3>
      <button (click)="toggleComments()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10 transition-colors">
        <span class="material-symbols-outlined text-slate-400 text-xl">close</span>
      </button>
    </div>
    <div class="flex-1 overflow-y-auto p-5 flex items-center justify-center" style="scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;">
      <!-- Empty State -->
      <div class="flex flex-col items-center gap-4 text-center">
        <div class="w-16 h-16 rounded-full bg-white/5 flex items-center justify-center">
          <span class="material-symbols-outlined text-3xl text-slate-500">chat_bubble_outline</span>
        </div>
        <div>
          <p class="text-slate-300 font-medium mb-1">Actualmente no hay comentarios</p>
          <p class="text-slate-500 text-sm">Se el primero en comentar sobre esta pista.</p>
        </div>
      </div>
    </div>
    <div class="p-5 bg-slate-950/40 border-t border-white/10">
      <div class="flex items-center gap-2 bg-white/5 border border-white/10 rounded-full pl-5 pr-2 py-2 focus-within:bg-white/10 transition-colors">
        <input class="bg-transparent border-none focus:ring-0 text-sm flex-1 placeholder-slate-500 text-white" placeholder="Add a comment..." type="text"/>
        <button class="w-9 h-9 flex items-center justify-center rounded-full bg-primary text-surface hover:scale-105 active:scale-95 transition-all shadow-lg shadow-primary/20">
          <span class="material-symbols-outlined text-[20px]">send</span>
        </button>
      </div>
    </div>
  </aside>
</div>
