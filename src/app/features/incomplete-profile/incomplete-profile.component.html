<main class="w-full max-w-lg mx-auto min-h-[60vh] flex flex-col items-center justify-center mt-12 mb-12" data-purpose="incomplete-profile-module">
  <div class="glass-card rounded-theme p-10 shadow-2xl relative overflow-hidden flex flex-col items-center text-center w-full">
    
    <!-- Animated Warning Icon -->
    <div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mb-6 ring-4 ring-primary/5">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="text-primary animate-pulse">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </div>

    <!-- Content -->
    <h2 class="text-3xl font-bold text-white mb-4 tracking-tight">Profile Incomplete</h2>
    
    <p class="text-slate-400 leading-relaxed mb-8">
      Your account has been successfully created, but you must specify whether you are a 
      <b class="text-white font-semibold">Normal User</b> or an 
      <b class="text-white font-semibold">Artist</b> 
      before you can browse the platform, upload music, or cast your votes on the daily charts.
    </p>

    <!-- Action Button -->
    <button class="w-full bg-gradient-to-r from-indigo-600 to-primary hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-4 rounded-theme transition-all transform hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-primary/20 text-lg" (click)="goToOnboarding()">
      Complete my Profile now
    </button>
  </div>
</main>
