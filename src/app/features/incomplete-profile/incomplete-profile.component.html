<div class="auth-container">
    <div class="auth-card glass-panel" style="max-width: 500px; padding: 3rem; text-align: center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none"
            stroke="var(--accent-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            style="margin-bottom: 1.5rem;">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>

        <h2 class="auth-title" style="margin-bottom: 1rem; font-size: 1.8rem;">Perfil Incompleto</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.6;">
            Tu cuenta ha sido creada, pero aún debes registrar si eres un <b style="color: white;">Usuario Normal</b> o
            un <b style="color: white;">Artista</b> antes de poder navegar por la plataforma, subir música o votar por
            otras canciones.
        </p>

        <button class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 0.8rem;"
            (click)="goToOnboarding()">
            Completar mi Perfil ahora
        </button>
    </div>
</div>
