<div class="auth-container">
    <div class="auth-card glass-panel auth-card-incomplete">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none"
            stroke="var(--accent-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="alert-icon">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>

        <h2 class="auth-title auth-title-large">Incomplete Profile</h2>
        <p class="auth-description">
            Your account has been created, but you must register whether you are a <b class="text-highlight">Normal
                User</b> or
            an <b class="text-highlight">Artist</b> before you can browse the platform, upload music, or vote for
            other tracks.
        </p>

        <button class="btn btn-primary submit-btn-large" (click)="goToOnboarding()">
            Complete my Profile now
        </button>
    </div>
</div>
