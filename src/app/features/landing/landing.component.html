<div class="landing-container"
    style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; text-align: center; padding: 2rem;">
    <h1 style="font-size: 4rem; font-weight: 800; margin-bottom: 1rem; color: #ffffff;">
        Discover and Rate <span style="background: var(--accent-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;">Incredible Music</span>
    </h1>
    <p
        style="font-size: 1.25rem; color: var(--text-secondary); max-width: 600px; margin-bottom: 2.5rem; line-height: 1.6;">
        Join a thriving community of artists and listeners. Upload your latest tracks, build your profile, and see how
        your music ranks on the charts.
    </p>

    <div style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;">
        <button class="btn btn-primary" routerLink="/auth"
            style="padding: 1rem 2.5rem; font-size: 1.15rem; font-weight: 600;">
            Get Started
        </button>
        <button class="btn btn-secondary" routerLink="/auth"
            style="padding: 1rem 2.5rem; font-size: 1.15rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
            Learn More
        </button>
    </div>

    <!-- Decoration -->
    <div
        style="margin-top: 4rem; position: relative; width: 100%; max-width: 800px; height: 300px; background: linear-gradient(to top, var(--bg-primary), transparent), url('https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=2070&auto=format&fit=crop') center/cover; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); opacity: 0.8; mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, transparent 100%);">
    </div>
</div>
