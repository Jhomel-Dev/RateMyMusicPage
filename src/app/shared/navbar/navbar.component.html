<nav class="navbar" *ngIf="!isNavHidden()">
    <div class="brand" routerLink="/">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
        </svg>
        Rate My Music
    </div>

    <!-- Authenticated Links -->
    <div class="nav-actions nav-links" *ngIf="isAuthenticated()">
        <a routerLink="/feed" class="nav-link">Feed</a>
        <a routerLink="/upload" class="nav-link">Upload Track</a>
        <a routerLink="/profile" class="nav-link">Profile</a>

        <div class="user-greeting" *ngIf="authService.currentUser()">
            Hello, {{ authService.currentUser()?.username }}
        </div>
        <button class="btn btn-secondary btn-nav" (click)="logout()">
            Logout
        </button>
    </div>

    <!-- Guest Links -->
    <div class="nav-actions nav-links" *ngIf="!isAuthenticated()">
        <a routerLink="/auth" class="btn btn-secondary btn-nav">Sign In</a>
        <a routerLink="/auth" class="btn btn-primary btn-nav">Register</a>
    </div>
</nav>
